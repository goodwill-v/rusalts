name: Deploy Staging

on:
  push:
    branches: ["staging"]

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

  deploy-staging:
    needs: test
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Sync repo to server
        run: |
          rsync -az --delete \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude '.venv' \
            --exclude 'data' \
            --exclude 'data_staging' \
            -e "ssh -p ${{ secrets.SSH_PORT }} -o ConnectTimeout=15" \
            ./ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/"

      - name: Deploy staging via docker compose
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" \
            -o ConnectTimeout=15 \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "bash -lc 'set -euo pipefail; cd \"${DEPLOY_PATH}\"; \
              echo \"==== staging deploy \$(date -Is) ====\" >> deploy.log; \
              docker compose -f docker-compose.staging.yml --env-file .env.staging up -d --build >> deploy.log 2>&1; \
              echo \"==== staging done \$(date -Is) ====\" >> deploy.log'"
