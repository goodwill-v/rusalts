# nginx: rusalts.ru (прод) — репо = источник правды.
# Применение: cp deploy/nginx-rusalts.ru.conf /etc/nginx/sites-enabled/rusalts.ru && nginx -t && systemctl reload nginx
# Секреты в конфиг не попадают: токен Browser Relay лежит в
# /etc/nginx/snippets/relay_auth.conf на сервере (в git не хранится, AGENTS.md §7).

server {
    server_name rusalts.ru;

    root /var/www/rusalts.ru/html;
    index index.html;
    client_max_body_size 10m;

    location ^~ /.well-known/acme-challenge/ {
        allow all;
        default_type "text/plain";
    }

location = /site_sova {
    return 301 /site_sova/;
}

location ^~ /site_sova/ {
    try_files $uri $uri/ /site_sova/index.html;
}

location = /oferta {
    default_type "text/html; charset=utf-8";
    alias /var/www/rusalts.ru/html/oferta.html;
}
    # App (Docker) — reverse proxy to FastAPI on port 8000
    location / {
        proxy_pass http://127.0.0.1:8000;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 60s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # VeZhPom — вебхук ЮKassa (подписки)
    location = /yookassa {
        proxy_pass http://127.0.0.1:4321/yookassa;
        include proxy_params;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # VeZhPom — Uptime Kuma push (пульсы резервных копий).
    # Публикуется ТОЛЬКО /api/push/ — панель Kuma снаружи не видна,
    # сам Kuma слушает 127.0.0.1:3001 (docker-compose, ports loopback).
    location ^~ /kuma-push/ {
        proxy_pass http://127.0.0.1:3001/api/push/;
        include proxy_params;
        proxy_set_header Host $host;
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    # Browser Relay — WebSocket proxy to OpenClaw Gateway
    location /relay {
        proxy_pass http://127.0.0.1:19001/__openclaw__/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        include /etc/nginx/snippets/relay_auth.conf;
        proxy_connect_timeout 30s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/rusalts.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rusalts.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = rusalts.ru) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name rusalts.ru;
    return 404;
}
